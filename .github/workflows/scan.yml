name: Automated WPScan
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  wordpress-wpscan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start environment with docker compose
        run: |
          cd docker
          docker compose up -d

      - name: Debug - check containers
        run: |
          echo "--- Running containers ---"
          docker ps -a
          echo "--- WordPress logs ---"
          docker logs $(docker ps -qf "name=wordpress")
          echo "--- DB logs ---"
          docker logs $(docker ps -qf "name=db")
          echo "--- Curl test ---"
          curl -v http://localhost:8080 || true

      - name: Wait for WordPress to be ready
        run: |
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080)
            echo "Attempt $i/24 - HTTP status: $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
              echo "WordPress is up!"
              break
            fi
            sleep 5
          done

      - name: Restore Database
        run: |
          docker exec -i $(docker ps -qf "name=docker-db-1") \
            mysql -uroot -p12345678 wordpress < docker/wordpress.sql

      - name: Generate Timestamp
        run: echo "TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV

      - name: Create scans directory
        run: mkdir -p scans

      - name: Run WPScan via Docker
        env:
          WPSCAN_TOKEN: ${{ secrets.WPSCAN_API_TOKEN }}
        run: |
          docker run --rm --network host wpscanteam/wpscan \
            --url http://localhost:8080 \
            --enumerate u,vp,vt \
            --force \
            --api-token $WPSCAN_TOKEN \
            > scans/automated_scan_${{ env.TIMESTAMP }}.txt || true

      - name: Upload WPScan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpscan-report-${{ env.TIMESTAMP }}
          path: scans/automated_scan_${{ env.TIMESTAMP }}.txt
